[project]
name = "mf-conductor"
version = "1.2.0"
description = "A powerful Custom Node Manager for ComfyUI with profile management, live console output, and standalone operation."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "squarewulf"}
]
keywords = [
    "comfyui",
    "custom-nodes",
    "node-manager",
    "stable-diffusion",
    "ai-art"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/FriskCinema/ComfyUI_MFConductor"
Repository = "https://github.com/FriskCinema/ComfyUI_MFConductor"
Issues = "https://github.com/FriskCinema/ComfyUI_MFConductor/issues"
Documentation = "https://github.com/FriskCinema/ComfyUI_MFConductor#readme"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mf_conductor"]
include-package-data = true

[tool.setuptools.package-data]
mf_conductor = [
    "web/*",
    "js/*",
    "data/*",
]

