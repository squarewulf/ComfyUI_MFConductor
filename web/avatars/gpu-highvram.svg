<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- GPU Card Body -->
  <rect x="8" y="16" width="48" height="32" rx="4" fill="#7C4DFF" stroke="#651FFF" stroke-width="2"/>
  <!-- Heat Sink Lines -->
  <line x1="16" y1="20" x2="16" y2="44" stroke="#651FFF" stroke-width="2"/>
  <line x1="24" y1="20" x2="24" y2="44" stroke="#651FFF" stroke-width="2"/>
  <line x1="32" y1="20" x2="32" y2="44" stroke="#651FFF" stroke-width="2"/>
  <line x1="40" y1="20" x2="40" y2="44" stroke="#651FFF" stroke-width="2"/>
  <line x1="48" y1="20" x2="48" y2="44" stroke="#651FFF" stroke-width="2"/>
  <!-- Fan Circle -->
  <circle cx="32" cy="32" r="8" fill="#311B92" stroke="#651FFF" stroke-width="1"/>
  <circle cx="32" cy="32" r="3" fill="#7C4DFF"/>
  <!-- PCIe Connector -->
  <rect x="12" y="48" width="40" height="6" rx="1" fill="#FFD54F"/>
  <rect x="16" y="50" width="4" height="2" fill="#F9A825"/>
  <rect x="24" y="50" width="4" height="2" fill="#F9A825"/>
  <rect x="32" y="50" width="4" height="2" fill="#F9A825"/>
  <rect x="40" y="50" width="4" height="2" fill="#F9A825"/>
  <!-- Lightning Bolt (Power) -->
  <polygon points="54,4 48,12 52,12 48,20 56,10 52,10" fill="#FFEB3B" stroke="#F57F17" stroke-width="0.5"/>
  <!-- Memory Bar (Full) -->
  <rect x="44" y="8" width="12" height="6" rx="1" fill="#424242" stroke="#616161" stroke-width="1" transform="translate(-36, 0)"/>
  <rect x="9" y="9" width="10" height="4" rx="0.5" fill="#B388FF"/>
</svg>

