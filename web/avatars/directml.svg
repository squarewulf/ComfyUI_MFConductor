<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- GPU Card Body (Blue for AMD/Intel) -->
  <rect x="8" y="16" width="48" height="32" rx="4" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
  <!-- Heat Sink Lines -->
  <line x1="16" y1="20" x2="16" y2="44" stroke="#1565C0" stroke-width="2"/>
  <line x1="24" y1="20" x2="24" y2="44" stroke="#1565C0" stroke-width="2"/>
  <line x1="32" y1="20" x2="32" y2="44" stroke="#1565C0" stroke-width="2"/>
  <line x1="40" y1="20" x2="40" y2="44" stroke="#1565C0" stroke-width="2"/>
  <line x1="48" y1="20" x2="48" y2="44" stroke="#1565C0" stroke-width="2"/>
  <!-- Fan Circle -->
  <circle cx="32" cy="32" r="8" fill="#0D47A1" stroke="#1565C0" stroke-width="1"/>
  <circle cx="32" cy="32" r="3" fill="#2196F3"/>
  <!-- PCIe Connector -->
  <rect x="12" y="48" width="40" height="6" rx="1" fill="#FFD54F"/>
  <rect x="16" y="50" width="4" height="2" fill="#F9A825"/>
  <rect x="24" y="50" width="4" height="2" fill="#F9A825"/>
  <rect x="32" y="50" width="4" height="2" fill="#F9A825"/>
  <rect x="40" y="50" width="4" height="2" fill="#F9A825"/>
  <!-- DirectML Badge -->
  <rect x="40" y="6" width="18" height="10" rx="2" fill="#E91E63"/>
  <text x="49" y="13" font-size="6" font-weight="bold" text-anchor="middle" fill="white">DML</text>
</svg>

