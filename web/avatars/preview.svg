<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Monitor Frame -->
  <rect x="8" y="10" width="48" height="36" rx="3" fill="#37474F" stroke="#263238" stroke-width="2"/>
  <!-- Screen -->
  <rect x="12" y="14" width="40" height="28" rx="1" fill="#78909C"/>
  <!-- Fast Forward Icon on Screen -->
  <polygon points="22,22 34,28 22,34" fill="#4CAF50"/>
  <polygon points="34,22 46,28 34,34" fill="#4CAF50"/>
  <!-- Monitor Stand -->
  <rect x="26" y="46" width="12" height="4" fill="#455A64"/>
  <rect x="20" y="50" width="24" height="4" rx="1" fill="#37474F"/>
  <!-- Speed Lines -->
  <line x1="4" y1="20" x2="8" y2="20" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="28" x2="8" y2="28" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="36" x2="8" y2="36" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="20" x2="60" y2="20" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="28" x2="60" y2="28" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="36" x2="60" y2="36" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"/>
</svg>

