<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- GPU Card Body -->
  <rect x="8" y="16" width="48" height="32" rx="4" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  <!-- Heat Sink Lines -->
  <line x1="16" y1="20" x2="16" y2="44" stroke="#2E7D32" stroke-width="2"/>
  <line x1="24" y1="20" x2="24" y2="44" stroke="#2E7D32" stroke-width="2"/>
  <line x1="32" y1="20" x2="32" y2="44" stroke="#2E7D32" stroke-width="2"/>
  <line x1="40" y1="20" x2="40" y2="44" stroke="#2E7D32" stroke-width="2"/>
  <line x1="48" y1="20" x2="48" y2="44" stroke="#2E7D32" stroke-width="2"/>
  <!-- Fan Circle -->
  <circle cx="32" cy="32" r="8" fill="#1B5E20" stroke="#2E7D32" stroke-width="1"/>
  <circle cx="32" cy="32" r="3" fill="#4CAF50"/>
  <!-- PCIe Connector -->
  <rect x="12" y="48" width="40" height="6" rx="1" fill="#FFD54F"/>
  <rect x="16" y="50" width="4" height="2" fill="#F9A825"/>
  <rect x="24" y="50" width="4" height="2" fill="#F9A825"/>
  <rect x="32" y="50" width="4" height="2" fill="#F9A825"/>
  <rect x="40" y="50" width="4" height="2" fill="#F9A825"/>
  <!-- Power Indicator -->
  <circle cx="50" cy="22" r="3" fill="#81C784"/>
</svg>

